# docker compose up   ->   open http://localhost:4000
# DATASET=large docker compose up   adds the generated 6-month history (about 5,000 fills)
services:
  chimera-rx:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATASET: ${DATASET:-demo}
      MFA: ${MFA:-0}
      TWO_STORES: ${TWO_STORES:-1}
      LLM_PROVIDER: none
      SEED_SYNTHETIC: "1"
    volumes:
      - chimera-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  chimera-data:
